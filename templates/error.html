<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Error {{ error_code }}</title>
    <script>(function(){try{var t=localStorage.getItem('theme');document.documentElement.classList.toggle('dark', t? t==='dark' : true);}catch(e){}})();</script>
    <link rel="preload" href="{{ url_for('static', filename='fonts/montserrat.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="container" style="max-width:520px">
    <div class="card" style="padding:32px;margin-top:14vh;text-align:center">
        <div class="mono" style="font-size:54px;font-weight:700;color:var(--accent);line-height:1">{{ error_code }}</div>
        <h1 style="font-size:20px;margin:10px 0 6px">{{ error_message }}</h1>
        <p class="subtext" style="margin:0 0 22px">{{ error_description }}</p>
        <a href="/" class="btn btn-primary">← Back home</a>
    </div>
</div>
</body>
</html>
